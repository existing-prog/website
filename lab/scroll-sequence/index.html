<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Essai — suite d’images au scroll</title>
  </head>
  <body>
    <main>
      <section class="intro">
        <p>ESSAI INTERNE · VIDÉO KLING (PROMPT A)</p>
        <h1>Faites défiler.</h1>
      </section>
      <section class="sequence" data-state="loading">
        <div class="sequence-track">
          <div class="sequence-stage">
            <canvas aria-hidden="true"></canvas>
            <div class="sequence-copy">
              <h2 class="sequence-title" aria-label="Margherita">
                <span class="outline">MARGHERITA</span>
                <span class="solid">L’ATELIER PIZZA</span>
              </h2>
              <p class="sequence-end">Votre carte. <em>Entre vos mains.</em></p>
            </div>
            <span class="sequence-meter"><span></span></span>
          </div>
        </div>
      </section>
      <section class="outro"><p>Fin de l’essai.</p></section>
    </main>
    <script type="module" src="/src/prototypes/scroll-sequence/main.ts"></script>
  </body>
</html>
