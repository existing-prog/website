name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      # Le build pré-rend les pages dans Chromium : le navigateur doit être installé avant.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Typecheck, build and prerender
        run: npm run build
      - name: Browser regression checks
        run: npm test
      - name: Firefox media suspension regression checks
        env:
          TEST_FIREFOX: "1"
        run: npm test -- tests/atelier-pizza.spec.ts --project=firefox -g "decoder|page-cache|first scroll"
      - name: Build configured contact form
        env:
          # Identifiant public fourni par Lucas ; une variable de dépôt peut le remplacer.
          VITE_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || 'xbgogapg' }}
        run: npm run build
      - name: Check configured contact form without sending messages
        env:
          TEST_DIRECT_DELIVERY: "1"
        run: npm test -- tests/request-delivery.spec.ts
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
